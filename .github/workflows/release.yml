name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-vs2022

      - name: Build and test
        run: |
          cmake --build --preset release --target dist
          cmake --build --preset tests
          ctest --preset release

      - name: Package
        run: cmake --build --preset release --target package

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem build -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object FullName
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "CS2 Demo Live HUD $env:GITHUB_REF_NAME"
          }
